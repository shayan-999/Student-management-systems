<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Data Management System
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">
       
        <h1>
            Student Data Management System
        </h1>

        <div class="form-container">

            <!--
                This ID is important.
                JavaScript changes this heading
                from Add Student to Edit Student.
            -->

            <h2 id="formTitle">
                Add Student
            </h2>


            <form id="studentForm">
                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="roll_no"
                    placeholder="Roll Number"
                    required
                >


                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                >


                <button
                    type="submit"
                    id="submitButton"
                >
                    Add Student
                </button>


                <button
                    type="button"
                    id="cancelButton"
                    class="cancel-button"
                    style="display: none;"
                >
                    Cancel
                </button>


            </form>


            <p id="message"></p>


        </div>




        <div class="student-container">


            <div class="heading-row">


                <h2>
                    Student List
                </h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search student..."
                >


            </div>


            <div class="table-wrapper">


                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Roll No
                            </th>

                            <th>
                                Course
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                        <!--
                            JavaScript will insert
                            student data here.
                        -->

                    </tbody>


                </table>


            </div>


        </div>


    </div>


    <script src="script.js"></script>


</body>

</html>
